<!-- Section: Hero -->
<section class="hero">
  <div class="hero-container text-center">
    <h1 class="hero-title fade-up delay-2">Contactez-nous</h1>

    <p class="hero-subtitle fade-up delay-3">
      Une question ou un problème ? Contactez le support FantasyRealm.
    </p>
  </div>
</section>

<!-- Section: Contact -->
<section class="contact-page fade-up delay-8">

  <h2 class="section-title">Informations</h2>

  <div class="form-card contact-infos-card">

    <div class="info-line">
      <div class="icon">
        <i class="bi bi-clock-fill"></i>
      </div>
      <p><strong>Horaires :</strong> Lun-Ven / 9h-18h</p>
    </div>

    <div class="info-line">
      <div class="icon">
        <i class="bi bi-telephone-fill"></i>
      </div>
      <p><strong>Téléphone :</strong> +33 1 23 45 67 89</p>
    </div>
  </div>

  <form class="contact-form-card fade-up delay-5">

    <div class="field fade-up delay-4">
      <label for="email">Email</label>
      <input type="email" id="email" placeholder="test@mail.fr" autocomplete="off">
    </div>

    <div class="field fade-up delay-7">
      <label for="pseudo">Pseudo</label>
      <input type="text" id="pseudo" placeholder="Votre pseudo (optionnel)" autocomplete="off">
    </div>

    <div class="field fade-up delay-8">
      <label for="message">Détail de la demande</label>
      <textarea id="message" placeholder="Votre message" autocomplete="off"></textarea>
    </div>

    <button class="btn btn-secondary btn-disabled">
      Envoyer
    </button>

  </form>

</section>
