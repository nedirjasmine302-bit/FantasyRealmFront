<!--Section: Hero -->
<section class="hero">
  <div class="hero-container text-center">
    <h1 class="hero-title fade-up">Détails de accessoire</h1>
    <p class="hero-subtitle fade-up delay-1">
      Consultez les informations complètes de l'accessoire sélectionné.
    </p>
  </div>
</section>

<div class="create-page accessory-page">

  <!--Section: Upload image -->
  <section class="upload upload-primary fade-up delay-2">
    <h2 class="section-title">Accessoire sélectionné</h2>

    <div class="upload-preview" id="uploadPreview">
      <img id="previewImage" alt="Aperçu de l'accessoire">
    </div>
  </section>

  <!--Section: Form -->
  <section class="form-structure fade-up delay-3">

    <!-- Features -->
    <div class="form-section form-section-primary fade-up">
      <h2 class="section-title">Caractéristiques</h2>

      <div class="field field-primary">
        <label for="name">Nom de l'accessoire</label>
        <input type="text" id="name" placeholder="Entrez un nom" autocomplete="off">
      </div>

      <div class="field">
        <label for="Type">Type</label>
      
        <div class="custom-select custom-select-primary" id="Type">
          <div class="custom-select-trigger">
            <span class="trigger-text" data-value="">Sélectionnez</span>
            <i class="bi bi-chevron-down arrow"></i>
          </div>
      
          <div class="custom-options">
            <div class="custom-option" data-value="armor">Armure</div>
            <div class="custom-option" data-value="weapon">Arme</div>
            <div class="custom-option" data-value="relique">Relique</div>
          </div>
        </div> 
      </div>

      <div class="field">
        <label for="rarity">Rareté</label>

        <div class="custom-select custom-select-primary" id="rarity">
          <div class="custom-select-trigger">
            <span class="trigger-text" data-value="">Sélectionnez</span>
            <i class="bi bi-chevron-down arrow"></i>
          </div>

          <div class="custom-options">
            <span class="custom-option" data-value="standard" data-rarity="standard">
              <span class="dot dot-standard"></span> Standard
            </span>

            <span class="custom-option" data-value="rare" data-rarity="rare">
              <span class="dot dot-rare"></span> Rare
            </span>

            <span class="custom-option" data-value="legendary" data-rarity="legendary">
              <span class="dot dot-legendary"></span> Légendaire
            </span>
          </div>
        </div>
      </div>

      <div class="field field-primary">
        <label for="description">Description</label>
        <textarea id="description" maxlength="300" placeholder="Décrivez votre personnage" autocomplete="off"></textarea>
      </div>
    </div>

    <!--Section: Bottom buttons -->
    <section class="bottom-actions fade-up delay-3">
      <div class="actions-wrapper center">
        <a href="my-space" class="btn btn-ghost-secondary">Retour</a>
      </div>

      <div class="feedback-zone"></div>
    </section>

  </section>

</div>
