<!-- Section: Hero -->
<section class="hero">
  <div class="hero-container text-center">
    <h1 class="hero-title fade-up delay-2">Nouveau mot de passe employé</h1>

    <p class="hero-subtitle fade-up delay-3">
      Saisissez l'email de l'employé et définissez un nouveau mot de passe.
    </p>
  </div>
</section>

<!-- Section: Reset employer password-->
<section class="auth-page reset-password fade-up delay-8">

  <form class="auth-form-container fade-up delay-5">

    <div class="field fade-up delay-4">
      <label for="email">Email</label>
      <input type="email" id="email" placeholder="test@mail.fr" autocomplete="off">
    </div>

    <div class="field fade-up delay-6">
      <label for="password">Nouveau mot de passe</label>
      <input type="password" id="password" placeholder="Le nouveau mot de passe" autocomplete="off">
    </div>

    <div class="field fade-up delay-7">
      <label for="password2">Confirmation du nouveau mot de passe</label>
      <input type="password" id="password2" placeholder="Le nouveau mot de passe" autocomplete="off">
    </div>

    <button class="btn btn-secondary btn-disabled">
      Changer le mot de passe
    </button>

  </form>

</section>
