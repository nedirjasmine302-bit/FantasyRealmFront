<!-- Section: Hero -->
<section class="hero">
  <div class="hero-container text-center">
    <h1 class="hero-title fade-up delay-2">Créer votre compte</h1>

    <p class="hero-subtitle fade-up delay-3">
      Rejoignez FantasyRealm Online et commencez à créer vos propres héros.
    </p>
  </div>
</section>

<!-- Section: Sign up -->
<section class="auth-page sign-up fade-up delay-8">

  <form class="auth-form-container fade-up delay-5">

    <div class="field fade-up delay-4">
      <label for="email">Email</label>
      <input type="email" id="email" placeholder="test@mail.fr" autocomplete="off">
    </div>

    <div class="field fade-up delay-7">
      <label for="pseudo">Pseudo</label>
      <input type="text" id="pseudo" placeholder="Votre pseudo" autocomplete="off">
    </div>

    <div class="field fade-up delay-6">
      <label for="password">Mot de passe</label>
      <input type="password" id="password" placeholder="Votre mot de passe" autocomplete="off">
    </div>

    <div class="field fade-up delay-7">
      <label for="password2">Confirmation du mot de passe</label>
      <input type="password" id="password2" placeholder="Votre mot de passe" autocomplete="off">
    </div>

    <button class="btn btn-secondary btn-disabled">
      Envoyer
    </button>

    <p class="auth-link fade-up delay-9">
      Vous avez déjà un compte ?
      <a href="sign-in">Connectez-vous ici !</a>
    </p>

  </form>

</section>
