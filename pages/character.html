<!--Section: Hero -->
<section class="hero">
  <div class="hcontainer text-center">
    <h1 class="hero-title fade-up">Les Personnages</h1>

    <p class="hero-subtitle fade-up delay-1">
      Découvrez les héros créés par les joueurs et trouvez l'inspiration pour votre prochaine aventure.
    </p>
  </div>
</section>

<!--Section: Filters -->
<section class="filters container fade-up delay-2">
  <form class="filters-form">

    <div class="field pseudo-field">
      <label for="pseudo">Pseudo</label>

      <div class="input-wrapper">
        <input type="text" id="pseudo-input" placeholder="Rechercher un pseudo...">
        <i class="bi bi-search search-icon"></i>
      </div>

      <div id="suggestions" class="pseudo-suggestions"></div>
    </div>

    <div class="field">
      <label for="genre-filter">Genres</label>

      <div class="custom-select genre-select" id="genre-filter">
        <div class="custom-select-trigger">
          <span class="trigger-text">Tous</span>
          <i class="bi bi-chevron-down arrow"></i>
        </div>

        <div class="custom-options">
          <span class="custom-option" data-value="">Tous</span>
          <span class="custom-option" data-value="mage">Mage</span>
          <span class="custom-option" data-value="guerrier">Guerrier</span>
          <span class="custom-option" data-value="archer">Archer</span>
        </div>
      </div>
    </div>

    <div class="field">
      <label for="date-filter">Date</label>

      <div class="custom-select date-select" id="date-filter">
        <div class="custom-select-trigger">
          <span class="trigger-text">Tous</span>
          <i class="bi bi-chevron-down arrow"></i>
        </div>

        <div class="custom-options">
          <span class="custom-option" data-value="">Tous</span>
          <span class="custom-option" data-value="today">Aujourd'hui</span>
          <span class="custom-option" data-value="yesterday">Hier</span>
          <span class="custom-option" data-value="7days">7 derniers jours</span>
          <span class="custom-option" data-value="30days">30 derniers jours</span>
          <span class="custom-option" data-value="year">Cette année</span>
          <span class="custom-option" data-value="old">Années précédentes</span>
        </div>
      </div>
    </div>

    <button type="button" class="btn btn-primary">Filtrer</button>
  </form>
</section>

<!--Section: Results -->
<section id="results" class="results-container fade-up delay-3"></section>

<!--Section: Characters -->
<section class="characters container fade-up delay-4"></section>
